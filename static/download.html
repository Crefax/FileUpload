<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dosya İndir - Crefax Upload</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
</head>
<body class="bg-dark">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="text-center mb-5">
                    <h1 class="display-4 text-white mb-3">Dosya İndir</h1>
                    <p class="lead text-muted">Dosyanızı güvenle indirin</p>
                </div>

                <div class="card bg-dark border-primary">
                    <div class="card-body text-center">
                        <i class="bi bi-file-earmark-arrow-down-fill text-primary" style="font-size: 4rem;"></i>
                        <h3 class="text-white mt-3" id="fileName">Dosya Yükleniyor...</h3>
                        <p class="text-muted" id="fileInfo">Dosya bilgileri yükleniyor...</p>
                        <div class="mt-4">
                            <a href="#" id="downloadLink" class="btn btn-primary btn-lg px-4">
                                <i class="bi bi-download me-2"></i>İndir
                            </a>
                            <a href="/" class="btn btn-outline-light btn-lg px-4 ms-2">
                                <i class="bi bi-arrow-left me-2"></i>Geri Dön
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const fileId = urlParams.get('id');

        if (!fileId) {
            window.location.href = '/';
        }

        async function loadFileInfo() {
            try {
                const response = await fetch(`/file/${fileId}`);
                if (response.ok) {
                    const fileInfo = await response.json();
                    document.getElementById('fileName').textContent = fileInfo.original_name;
                    document.getElementById('fileInfo').textContent = `Yüklenme Tarihi: ${new Date(fileInfo.upload_date * 1000).toLocaleString()}`;
                    document.getElementById('downloadLink').href = `/download/${fileId}`;
                } else {
                    window.location.href = '/';
                }
            } catch (error) {
                console.error('Error:', error);
                window.location.href = '/';
            }
        }

        loadFileInfo();
    </script>
</body>
</html>
