<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crefax Upload</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
</head>
<body class="bg-dark">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="text-center mb-5">
                    <h1 class="display-4 text-white mb-3">Crefax Upload</h1>
                    <p class="lead text-muted">Dosyalarınızı güvenle yükleyin ve paylaşın</p>
                </div>

                <div class="upload-container bg-dark border border-primary rounded-4 p-5 mb-4">
                    <div class="upload-area">
                        <i class="bi bi-cloud-arrow-up-fill text-primary" style="font-size: 4rem;"></i>
                        <h3 class="text-white mt-3">Dosya Yükle</h3>
                        <p class="text-muted">Dosya seçmek için tıklayın</p>
                        <input type="file" id="fileInput" class="d-none">
                        <button class="btn btn-primary btn-lg px-4" onclick="document.getElementById('fileInput').click()">
                            <i class="bi bi-upload me-2"></i>Dosya Seç
                        </button>
                    </div>
                </div>

                <div id="fileList" class="row g-4">
                    <!-- Dosyalar buraya dinamik olarak eklenecek -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const fileInfo = await response.json();
                    addFileCard(fileInfo);
                }
            } catch (error) {
                console.error('Upload error:', error);
            }
        });

        function addFileCard(fileInfo) {
            const card = document.createElement('div');
            card.className = 'col-md-6';
            card.innerHTML = `
                <div class="card bg-dark border-primary h-100">
                    <div class="card-body">
                        <h5 class="card-title text-white">${fileInfo.original_name}</h5>
                        <p class="card-text text-muted">
                            <small>
                                <i class="bi bi-clock me-1"></i>${new Date(fileInfo.upload_date * 1000).toLocaleString()}
                            </small>
                        </p>
                        <div class="d-flex gap-2">
                            <a href="/download.html?id=${fileInfo.id}" class="btn btn-primary flex-grow-1">
                                <i class="bi bi-download me-2"></i>İndir
                            </a>
                            <a href="/delete.html?id=${fileInfo.delete_id}" class="btn btn-danger">
                                <i class="bi bi-trash"></i>
                            </a>
                        </div>
                    </div>
                </div>
            `;
            fileList.prepend(card);
        }
    </script>
</body>
</html>
